<!-- Primary lockup for light backgrounds. Wordmark uses Archivo (Google Fonts, weight 900);
     if opened in a tool without that font installed, the text falls back to the nearest
     bold sans-serif. For print/engraving, convert the text to outlines first. -->
<svg width="340" height="72" viewBox="0 0 340 72" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(0,2)">
    <path d="M48 14 A22 22 0 1 0 48 58 L48 49 A13 13 0 1 1 48 23 Z" fill="#4A2545"/>
    <rect x="44" y="26" width="13" height="6" rx="3" fill="#E0A32E" stroke="#B08A2E" stroke-width="1"/>
    <rect x="44" y="33" width="13" height="6" rx="3" fill="#E0A32E" stroke="#B08A2E" stroke-width="1"/>
    <rect x="44" y="40" width="13" height="6" rx="3" fill="#E0A32E" stroke="#B08A2E" stroke-width="1"/>
  </g>
  <text x="72" y="42" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5" fill="#4A2545">COUNTRA</text>
  <text x="72" y="60" font-family="'IBM Plex Mono', 'Courier New', monospace" font-weight="600" font-size="11" letter-spacing="2.2" fill="#B08A2E">ACCOUNTING &amp; BOOKKEEPING</text>
</svg>
